# Orchestrator Pipeline Configuration
# ─────────────────────────────────────
# Schema per pipeline:
#   description:        Human-readable label
#   triggers:           List of [cli, cron, api]
#   memory_context_n:   How many past runs to inject as context (Phase 7, default 5)
#   prompt_optimizer:   Phase 8 settings
#     enabled:          true/false
#     threshold:        Min score to accept output (1–10, default 7)
#     max_retries:      Max mutation retries per run (default 2)
#   nodes:              Ordered list of node definitions
#     name:             Unique node identifier (used in logs)
#     type:             claude | ollama | eval | python | subprocess
#     tier:             (claude nodes only) claude | free | free-then-verify
#                       claude          = default, unchanged Claude call
#                       free            = free chain only (Groq→Gemini→Ollama), never escalates
#                       free-then-verify= free chain, gated, escalate to Claude on gate failure
#                       Escalation costs a free call PLUS a Claude call — check
#                       `llmroute.telemetry.recommendations()` and flip any node
#                       escalating >30% of runs to tier: claude.
#     task_type:        (tier != claude) routing key into ~/.claude/routing/model-registry.json
#                       e.g. compress | classify | extract | summarize. Default: compress
#     gate:             (tier != claude) algorithmic accept test — never an LLM call
#       min_chars:      Reject output shorter than this
#       max_chars:      Reject output longer than this
#       require_json:   Output must parse as JSON
#       require_keys:   List of keys that must be present in the parsed JSON
#       forbid_patterns:Reject if any of these substrings appear (e.g. refusals)
#     model:            Model ID string
#     system:           System prompt (no hardcoded prompts in core — lives here)
#     prompt_template:  User message template; {input} is replaced with prior node output
#     max_tokens:       (Claude only) token cap for response
#     temperature:      Sampling temperature (0.0–1.0)
#     threshold:        (eval nodes only) min score before triggering optimizer retry

defaults:
  claude_model: claude-sonnet-4-6   # single source of truth — bump here only

pipelines:

  trading:
    description: "EOD price action → Python template summary → Claude BUY/HOLD/SELL decision"
    triggers:
      - cli
      - cron
    memory_context_n: 5
    prompt_optimizer:
      enabled: true
      threshold: 7
      max_retries: 2
    nodes:
      - name: summarizer
        type: python
        fn: pipelines.trading.summarize_prices
        # Deterministic template — replaces OllamaNode. Parses OHLCV table from
        # fetch_eod_data() and emits a structured block Claude can reason over.
        # Algorithm-first: zero variance, no Ollama dependency on this step.

      - name: decision
        type: claude
        system: >
          You are a quantitative trading analyst. Given a price summary, reply with
          exactly one of: BUY, HOLD, or SELL — followed by a one-sentence reason.
          Format: DECISION: <BUY|HOLD|SELL> — <reason>
        prompt_template: |
          Based on this price summary, provide a trading decision:

          {input}
        max_tokens: 256
        temperature: 0.2

      - name: eval
        type: eval
        threshold: 7

  context_summarizer:
    description: "Compress project files into a structured CLAUDE.md-ready summary"
    triggers:
      - cli
    memory_context_n: 3
    prompt_optimizer:
      enabled: false
      threshold: 7
      max_retries: 1
    nodes:
      - name: chunk_summarizer
        type: ollama
        model: qwen2.5-coder
        system: >
          You summarize source code files and documentation concisely. Preserve key
          function names, classes, patterns, and dependencies. Omit boilerplate.
        prompt_template: |
          Summarize the following project files:

          {input}
        temperature: 0.1

      - name: structured_summary
        type: claude
        system: >
          You produce structured project summaries formatted for CLAUDE.md files.
          Include: purpose, key files, tech stack, important patterns, gotchas.
          Use markdown headers. Be concise — this summary is read before every session.
        prompt_template: |
          Create a structured CLAUDE.md-ready project summary from these file summaries:

          {input}
        max_tokens: 2048
        temperature: 0.1

      - name: eval
        type: eval
        threshold: 6

  px_dashboard:
    description: "Sync PX_data_2026 spreadsheet → MotherDuck, then generate a Claude sync report"
    triggers:
      - cli
      - api
    memory_context_n: 3
    prompt_optimizer:
      enabled: false
      threshold: 7
      max_retries: 1
    nodes: []   # handled by PxDashboardPipeline Python class

  psych_report:
    description: "Placeholder — future psych/assessment pipeline"
    triggers:
      - api
    memory_context_n: 5
    prompt_optimizer:
      enabled: false
      threshold: 7
      max_retries: 2
    nodes: []

  trading_scan_daily:
    description: "Run crypto scan (--once) → llama3.2:3b market digest → Telegram via deliver_scan.py"
    triggers:
      - cli
      - cron
    memory_context_n: 0   # deterministic output, no memory injection
    prompt_optimizer:
      enabled: false
      threshold: 7
      max_retries: 1
    nodes:
      - name: run_scan
        type: subprocess
        # Set BOT_SCRIPT env var in .env, or replace with absolute path
        command: "python $BOT_SCRIPT --once"
        timeout: 120
        keep_keywords:
          - "BUY"
          - "SELL"
          - "HOLD"
          - "Regime"
          - "SCAN @"
          - "Portfolio"

      - name: market_summary
        type: python
        fn: deliver_scan.interpret_scan
        # Deterministic cross-asset digest — replaces llama3.2:3b Ollama node.
        # Tallies BUY/SELL counts per asset class, identifies dominant theme,
        # and surfaces highest-confidence signal in 2-3 plain sentences.
        # Note: deliver_scan.py also calls interpret_scan() directly in main().
