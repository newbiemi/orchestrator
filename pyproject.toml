[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "httpx",
    "pyyaml",
    "ruamel.yaml",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "rich",
    "yfinance",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "pipelines*"]
